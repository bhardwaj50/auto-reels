name: Auto Hindi Fact Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  create-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts moviepy==1.0.3 deep-translator requests "Pillow<10"

      - name: Generate Reel
        run: python make_reel.py

      - name: Save Reel for Download
        uses: actions/upload-artifact@v4
        with:
          name: daily-fact-reel
          path: daily_fact_reel.mp4
